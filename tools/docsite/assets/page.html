<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - gocpp</title>
<link rel="stylesheet" href="{{.Root}}assets/style.css">
</head>
<body>
<header class="top">
<a class="brand" href="{{.Root}}index.html">gocpp</a>
<form class="search" role="search" onsubmit="return false">
<input id="gp-search" type="search" placeholder="Search the docs" autocomplete="off" aria-label="Search the docs">
<ul id="gp-results" hidden></ul>
</form>
</header>
<div class="layout">
<nav class="side" aria-label="Documentation">
{{range .Nav}}<details{{if .Open}} open{{end}}>
<summary>{{.Title}}</summary>
<ul>
{{range .Items}}<li{{if .Current}} class="current"{{end}}><a href="{{.Href}}">{{.Title}}</a></li>
{{end}}</ul>
</details>
{{end}}</nav>
<main>
<article>
{{.Body}}
</article>
<nav class="pager" aria-label="Previous and next">
{{if .Prev}}<a class="prev" href="{{.Prev.Href}}">&larr; {{.Prev.Title}}</a>{{end}}
{{if .Next}}<a class="next" href="{{.Next.Href}}">{{.Next.Title}} &rarr;</a>{{end}}
</nav>
<footer>{{if .Source}}<a href="{{.Source}}">Edit this page on GitHub</a> &middot; {{end}}gocpp documentation</footer>
</main>
</div>
<script src="{{.Root}}assets/search-index.js"></script>
<script src="{{.Root}}assets/search.js" data-root="{{.Root}}"></script>
</body>
</html>
